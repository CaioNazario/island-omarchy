name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # Arch: quickshell e qt6-declarative vêm do repositório oficial, e o
    # qmllint precisa dos .qmltypes do Quickshell para checar o plugin.
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed git make nodejs npm quickshell qt6-declarative
      - uses: actions/checkout@v4
      - run: npm ci
      - run: make lint
      - run: make test
      - run: make build
